version: "3.9"

services:
  db:
    image: postgres:16-alpine
    container_name: ipl2026-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ipl_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ipl_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-ipl_predictions}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ipl_user} -d ${POSTGRES_DB:-ipl_predictions}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ipl2026-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-ipl_user}:${POSTGRES_PASSWORD:-ipl_secret_2026}@db:5432/${POSTGRES_DB:-ipl_predictions}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
      RATE_LIMIT_PREDICT: 60/minute
      CACHE_TTL_SECONDS: 300
    ports:
      - "8000:8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: ipl2026-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"

volumes:
  pgdata:
