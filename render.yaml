services:
  - type: web
    name: ipl-2026-prediction-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: .
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: RATE_LIMIT_PREDICT
        value: 60/minute
      - key: CACHE_TTL_SECONDS
        value: "300"
      - key: DATABASE_URL
        fromDatabase:
          name: ipl-2026-postgres
          property: connectionString

databases:
  - name: ipl-2026-postgres
    plan: free
    databaseName: ipl_predictions
    user: ipl_user
