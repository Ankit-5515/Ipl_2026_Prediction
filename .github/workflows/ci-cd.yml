name: IPL 2026 CI/CD & Keep-Alive Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "*/14 * * * *"
  workflow_dispatch:

jobs:
  backend-ml-test:
    if: github.event_name != 'schedule'
    name: ML Pipeline & FastAPI Pytest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Train & Verify ML Model Artifact
        run: python -m ml.train

      - name: Run Pytest Unit & API Integration Tests
        run: python -m pytest -v

  frontend-build:
    if: github.event_name != 'schedule'
    name: Next.js TypeScript & Production Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: npm install

      - name: Type-check & Build Next.js App
        env:
          VERCEL: "1"
        run: npm run build

  keep-alive-ping:
    if: github.event_name == 'schedule'
    name: Free-Tier Cold Start Keep-Alive Ping
    runs-on: ubuntu-latest
    steps:
      - name: Ping Production /api/health Endpoint
        env:
          PROD_API_URL: ${{ vars.PRODUCTION_API_URL }}
        run: |
          if [ -n "$PROD_API_URL" ]; then
            curl -fsSL "$PROD_API_URL/api/health" || true
          fi
